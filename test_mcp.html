<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>PXView MCP Test Console</title>
<style>
:root {
  --bg: #1a1a2e; --surface: #16213e; --surface2: #0f3460;
  --accent: #e94560; --accent2: #533483; --text: #eee; --text2: #aaa;
  --success: #4caf50; --error: #f44336; --warn: #ff9800;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.header { background: var(--surface); padding: 12px 20px; display: flex; align-items: center; gap: 16px; border-bottom: 2px solid var(--accent); }
.header h1 { font-size: 18px; font-weight: 600; }
.header .status { font-size: 13px; color: var(--text2); }
.header .status.connected { color: var(--success); }
.main { display: flex; height: calc(100vh - 52px); }
.left { width: 280px; background: var(--surface); border-right: 1px solid #333; overflow-y: auto; flex-shrink: 0; }
.right { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.tool-list { padding: 8px; }
.tool-btn { display: block; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 4px; background: var(--surface2); border: 1px solid transparent; border-radius: 6px; color: var(--text); cursor: pointer; font-size: 13px; transition: all .15s; }
.tool-btn:hover { border-color: var(--accent); background: #1a3a6e; }
.tool-btn.active { border-color: var(--accent); background: var(--accent2); }
.tool-btn .tool-cat { font-size: 10px; color: var(--text2); display: block; margin-top: 2px; }
.panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.panel-header { padding: 12px 16px; background: var(--surface); border-bottom: 1px solid #333; }
.panel-header h2 { font-size: 16px; margin-bottom: 4px; }
.panel-header .desc { font-size: 12px; color: var(--text2); }
.panel-body { flex: 1; overflow-y: auto; padding: 16px; }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 4px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 8px 10px; background: var(--bg); border: 1px solid #444; border-radius: 4px;
  color: var(--text); font-size: 13px; font-family: 'Consolas', monospace;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); outline: none; }
.form-group textarea { min-height: 80px; resize: vertical; }
.btn-row { display: flex; gap: 8px; margin-top: 12px; }
.btn { padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all .15s; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #c73650; }
.btn-secondary { background: #444; color: #fff; }
.btn-secondary:hover { background: #555; }
.btn-sm { padding: 4px 10px; font-size: 11px; }
.result-area { margin-top: 16px; }
.result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.result-header span { font-size: 12px; color: var(--text2); }
.result-pre {
  background: #0d1117; border: 1px solid #333; border-radius: 6px; padding: 12px;
  font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; line-height: 1.5;
  max-height: 400px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
}
.result-pre.error { border-color: var(--error); color: #ff6b6b; }
.result-pre.success { border-color: var(--success); }
.log-area { background: var(--surface); border-top: 1px solid #333; max-height: 150px; overflow-y: auto; padding: 8px 12px; font-family: 'Consolas', monospace; font-size: 11px; color: var(--text2); }
.log-entry { padding: 2px 0; border-bottom: 1px solid #222; }
.log-entry .time { color: #666; }
.log-entry .method { color: var(--accent); }
.log-entry .ok { color: var(--success); }
.log-entry .err { color: var(--error); }
.tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; }
.tag-get { background: #1a5276; color: #5dade2; }
.tag-post { background: #1a5276; color: #5dade2; }
.quick-actions { padding: 8px; border-top: 1px solid #333; }
.quick-actions h3 { font-size: 12px; color: var(--text2); margin-bottom: 6px; }
.quick-btn { display: block; width: 100%; text-align: left; padding: 6px 10px; margin-bottom: 3px; background: transparent; border: 1px solid #444; border-radius: 4px; color: var(--text2); cursor: pointer; font-size: 11px; transition: all .15s; }
.quick-btn:hover { border-color: var(--success); color: var(--success); }
.channel-map-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.channel-map-row label { min-width: 80px; font-size: 12px; color: var(--text2); }
.channel-map-row select { flex: 1; }
.option-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.option-row label { min-width: 100px; font-size: 12px; color: var(--text2); }
.option-row input, .option-row select { flex: 1; }
</style>
</head>
<body>

<div class="header">
  <h1>PXView MCP Console</h1>
  <span class="status" id="connStatus">Disconnected</span>
  <span style="flex:1"></span>
  <input id="mcpUrl" value="http://127.0.0.1:10530/mcp" style="width:260px;padding:4px 8px;background:var(--bg);border:1px solid #444;border-radius:4px;color:var(--text);font-size:12px;font-family:Consolas,monospace;">
  <button class="btn btn-primary btn-sm" onclick="initMcp()">Connect</button>
</div>

<div class="main">
  <div class="left">
    <div class="tool-list" id="toolList"></div>
    <div class="quick-actions">
      <h3>Quick Flows</h3>
      <button class="quick-btn" onclick="quickFullFlow()">Full Flow: Capture + SPI Decode</button>
      <button class="quick-btn" onclick="quickListAnalyzers()">List All Analyzers</button>
      <button class="quick-btn" onclick="quickGetDevices()">Get Devices</button>
    </div>
  </div>
  <div class="right">
    <div class="panel">
      <div class="panel-header">
        <h2 id="panelTitle">Select a tool</h2>
        <div class="desc" id="panelDesc"></div>
      </div>
      <div class="panel-body" id="panelBody">
        <p style="color:var(--text2)">Select a tool from the left panel, or use a Quick Flow.</p>
      </div>
    </div>
    <div class="log-area" id="logArea"></div>
  </div>
</div>

<script>
const TOOLS = [
  { name:'initialize', cat:'System', desc:'Initialize MCP connection', params:{} },
  { name:'get_devices', cat:'Device', desc:'List available devices', params:{} },
  { name:'start_capture', cat:'Capture', desc:'Start signal capture', params:{deviceId:{type:'text',placeholder:'Device ID from get_devices'}} },
  { name:'close_capture', cat:'Capture', desc:'Stop signal capture', params:{} },
  { name:'get_capture_status', cat:'Capture', desc:'Get current capture status', params:{} },
  { name:'get_channel_list', cat:'Signal', desc:'List channels for current device', params:{} },
  { name:'get_signal_data', cat:'Signal', desc:'Get raw signal data', params:{channelIndex:{type:'number',placeholder:'0'},startTime:{type:'number',placeholder:'0'},endTime:{type:'number',placeholder:'0'}} },
  { name:'list_analyzers', cat:'Decode', desc:'List all available protocol analyzers', params:{} },
  { name:'get_analyzer_options', cat:'Decode', desc:'Get options & channels for an analyzer', params:{analyzerName:{type:'text',placeholder:'e.g. spi_c, i2c_c, uart_c'}} },
  { name:'add_analyzer', cat:'Decode', desc:'Add a protocol analyzer with settings', params:{analyzerName:{type:'text',placeholder:'spi_c'},settings:{type:'json',placeholder:'{"options":{},"channelMap":{}}'}} },
  { name:'get_analyzer_results', cat:'Decode', desc:'Get decode results', params:{analyzerId:{type:'text',placeholder:'Instance ID from add_analyzer'}} },
  { name:'remove_analyzer', cat:'Decode', desc:'Remove an analyzer', params:{analyzerId:{type:'text',placeholder:'Instance ID'}} },
  { name:'get_analyzer_list', cat:'Decode', desc:'List active analyzers', params:{} },
  { name:'get_trigger_settings', cat:'Trigger', desc:'Get trigger configuration', params:{} },
  { name:'set_trigger', cat:'Trigger', desc:'Configure trigger', params:{settings:{type:'json',placeholder:'{}'}} },
];

let mcpUrl = 'http://127.0.0.1:10530/mcp';
let reqId = 0;
let connected = false;
let cachedDevices = [];
let cachedAnalyzerOptions = null;

// ---- MCP Communication ----
async function mcpCall(method, params = {}) {
  const id = ++reqId;
  const body = { jsonrpc:'2.0', id, method, params };
  log(`${method}`, 'method');
  try {
    const resp = await fetch(mcpUrl, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    const data = await resp.json();
    if (data.error) {
      log(`${method} ERROR: ${data.error.message||JSON.stringify(data.error)}`, 'err');
      return data;
    }
    log(`${method} OK`, 'ok');
    return data;
  } catch(e) {
    log(`${method} FAIL: ${e.message}`, 'err');
    return { error: { message: e.message } };
  }
}

async function callTool(name, args = {}) {
  return mcpCall('tools/call', { name, arguments: args });
}

// ---- Logging ----
function log(msg, type='') {
  const area = document.getElementById('logArea');
  const t = new Date().toLocaleTimeString();
  area.innerHTML += `<div class="log-entry"><span class="time">${t}</span> <span class="${type}">${msg}</span></div>`;
  area.scrollTop = area.scrollHeight;
}

// ---- Render tool list ----
function renderToolList() {
  const el = document.getElementById('toolList');
  let html = '';
  let lastCat = '';
  TOOLS.forEach(t => {
    if (t.cat !== lastCat) {
      html += `<div style="padding:6px 12px 2px;font-size:10px;color:var(--accent);text-transform:uppercase;font-weight:700;letter-spacing:1px;">${t.cat}</div>`;
      lastCat = t.cat;
    }
    html += `<button class="tool-btn" onclick="showTool('${t.name}')" id="btn-${t.name}">
      ${t.name}<span class="tool-cat">${t.desc}</span></button>`;
  });
  el.innerHTML = html;
}

// ---- Show tool form ----
function showTool(name) {
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('btn-' + name);
  if (btn) btn.classList.add('active');

  const tool = TOOLS.find(t => t.name === name);
  if (!tool) return;

  document.getElementById('panelTitle').textContent = tool.name;
  document.getElementById('panelDesc').textContent = tool.desc;

  let html = '<form onsubmit="return false;">';
  const paramKeys = Object.keys(tool.params);
  if (paramKeys.length === 0) {
    html += '<p style="color:var(--text2);font-size:13px;">No parameters required.</p>';
  } else {
    paramKeys.forEach(key => {
      const p = tool.params[key];
      if (p.type === 'json') {
        html += `<div class="form-group"><label>${key}</label><textarea id="param-${key}" placeholder='${p.placeholder||''}'>{}</textarea></div>`;
      } else if (p.type === 'number') {
        html += `<div class="form-group"><label>${key}</label><input type="number" id="param-${key}" placeholder="${p.placeholder||''}"></div>`;
      } else {
        html += `<div class="form-group"><label>${key}</label><input type="text" id="param-${key}" placeholder="${p.placeholder||''}"></div>`;
      }
    });
  }
  html += `<div class="btn-row"><button class="btn btn-primary" onclick="execTool('${name}')">Execute</button>
    <button class="btn btn-secondary" onclick="copyCurl('${name}')">Copy curl</button></div>`;
  html += '</form>';
  html += '<div class="result-area" id="resultArea"></div>';
  document.getElementById('panelBody').innerHTML = html;
}

// ---- Execute tool ----
async function execTool(name) {
  const tool = TOOLS.find(t => t.name === name);
  const args = {};
  Object.keys(tool.params).forEach(key => {
    const el = document.getElementById('param-' + key);
    if (!el) return;
    let val = el.value.trim();
    if (tool.params[key].type === 'json') {
      try { val = JSON.parse(val); } catch(e) { alert('Invalid JSON for ' + key); return; }
    } else if (tool.params[key].type === 'number') {
      val = val === '' ? undefined : Number(val);
    } else if (val === '') {
      return; // skip empty
    }
    if (val !== undefined) args[key] = val;
  });

  const result = await callTool(name, args);
  renderResult(result);
}

function renderResult(result) {
  const area = document.getElementById('resultArea');
  if (!area) return;

  if (result.error) {
    area.innerHTML = `<div class="result-header"><span>Error</span></div>
      <pre class="result-pre error">${escHtml(JSON.stringify(result.error, null, 2))}</pre>`;
    return;
  }

  let content = result.result;
  if (content && content.content && content.content[0]) {
    try {
      const parsed = JSON.parse(content.content[0].text);
      content = parsed;
    } catch(e) {
      content = content.content[0].text;
    }
  }

  const isError = content && typeof content === 'object' && content.isError;
  area.innerHTML = `<div class="result-header"><span>Result</span>
    <button class="btn btn-sm btn-secondary" onclick="copyResult()">Copy</button></div>
    <pre class="result-pre ${isError?'error':'success'}">${escHtml(typeof content === 'string' ? content : JSON.stringify(content, null, 2))}</pre>`;
}

function copyResult() {
  const pre = document.querySelector('.result-pre');
  if (pre) navigator.clipboard.writeText(pre.textContent);
}

function copyCurl(name) {
  const tool = TOOLS.find(t => t.name === name);
  const args = {};
  Object.keys(tool.params).forEach(key => {
    const el = document.getElementById('param-' + key);
    if (!el || !el.value.trim()) return;
    let val = el.value.trim();
    if (tool.params[key].type === 'json') {
      try { val = JSON.parse(val); } catch(e) { return; }
    }
    args[key] = val;
  });
  const body = { jsonrpc:'2.0', id:1, method:'tools/call', params:{ name, arguments:args } };
  const cmd = `curl -s -X POST "${mcpUrl}" -H "Content-Type: application/json" -d '${JSON.stringify(body)}'`;
  navigator.clipboard.writeText(cmd);
  alert('curl command copied!');
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ---- MCP Init ----
async function initMcp() {
  mcpUrl = document.getElementById('mcpUrl').value.trim();
  const result = await mcpCall('initialize', {
    protocolVersion:'2025-03-26', capabilities:{}, clientInfo:{name:'PXView-WebUI',version:'1.0'}
  });
  if (result && !result.error) {
    connected = true;
    document.getElementById('connStatus').textContent = 'Connected';
    document.getElementById('connStatus').className = 'status connected';
    // Send initialized notification
    await fetch(mcpUrl, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({jsonrpc:'2.0',method:'notifications/initialized'})
    });
  }
}

// ---- Quick Flows ----
async function quickGetDevices() {
  const r = await callTool('get_devices');
  renderResult(r);
  if (r && r.result) {
    try {
      const devs = JSON.parse(r.result.content[0].text);
      cachedDevices = devs;
      log(`Found ${devs.length} devices`, 'ok');
    } catch(e) {}
  }
}

async function quickListAnalyzers() {
  const r = await callTool('list_analyzers');
  renderResult(r);
}

async function quickFullFlow() {
  const area = document.getElementById('panelBody');
  document.getElementById('panelTitle').textContent = 'Full Flow: Capture + SPI Decode';
  document.getElementById('panelDesc').textContent = 'Automated end-to-end test';

  area.innerHTML = '<div id="flowLog" style="font-family:Consolas,monospace;font-size:12px;line-height:2;"></div>';
  const flog = (msg, cls='') => {
    document.getElementById('flowLog').innerHTML += `<div class="${cls}">${msg}</div>`;
  };

  // 1. Get devices
  flog('1. Getting devices...');
  let r = await callTool('get_devices');
  if (r.error) { flog('   FAIL: ' + r.error.message, 'err'); return; }
  let devs = JSON.parse(r.result.content[0].text);
  let demo = devs.find(d => d.is_demo) || devs[0];
  if (!demo) { flog('   No devices found!', 'err'); return; }
  flog(`   Device: ${demo.name} (id=${demo.id})`, 'ok');

  // 2. Start capture
  flog('2. Starting capture...');
  r = await callTool('start_capture', { deviceId: demo.id });
  if (r.error) { flog('   FAIL: ' + r.error.message, 'err'); return; }
  flog('   Capture started', 'ok');

  // 3. Get analyzer options
  flog('3. Getting SPI analyzer options...');
  r = await callTool('get_analyzer_options', { analyzerName: 'spi_c' });
  if (r.error) { flog('   FAIL: ' + r.error.message, 'err'); return; }
  let opts = JSON.parse(r.result.content[0].text);
  flog(`   Channels: ${opts.channels.map(c=>c.name).join(', ')}`, 'ok');
  flog(`   Options: ${opts.options.map(o=>o.id).join(', ')}`, 'ok');

  // 4. Add analyzer
  flog('4. Adding SPI analyzer...');
  const channelMap = {};
  const signals = opts.availableSignals || [];
  opts.channels.forEach(ch => {
    const sig = signals.find(s => s.name && s.name.toLowerCase().includes(ch.name.toLowerCase()));
    if (sig) channelMap[ch.name] = sig.index;
    else if (ch.required) channelMap[ch.name] = 0; // fallback
  });
  r = await callTool('add_analyzer', {
    analyzerName: 'spi_c',
    settings: { options: { cpol: '0', cpha: '0' }, channelMap }
  });
  if (r.error) { flog('   FAIL: ' + r.error.message, 'err'); return; }
  let inst = JSON.parse(r.result.content[0].text);
  const instId = inst.instance_id || inst.instanceId;
  flog(`   Added! Instance ID: ${instId}`, 'ok');

  // 5. Get results
  flog('5. Getting decode results...');
  await new Promise(r => setTimeout(r, 2000));
  r = await callTool('get_analyzer_results', { analyzerId: instId });
  if (r.error) { flog('   FAIL: ' + r.error.message, 'err'); } else {
    let results = JSON.parse(r.result.content[0].text);
    flog(`   Got ${results.annotations ? results.annotations.length : 0} annotations`, 'ok');
  }

  // 6. Remove analyzer
  flog('6. Removing analyzer...');
  r = await callTool('remove_analyzer', { analyzerId: instId });
  if (r.error) { flog('   FAIL: ' + r.error.message, 'err'); } else {
    flog('   Removed!', 'ok');
  }

  // 7. Close capture
  flog('7. Closing capture...');
  r = await callTool('close_capture');
  if (r.error) { flog('   FAIL: ' + r.error.message, 'err'); } else {
    flog('   Closed!', 'ok');
  }

  flog('<br><b>Full flow completed!</b>', 'ok');
}

// ---- Init ----
renderToolList();
</script>
</body>
</html>
