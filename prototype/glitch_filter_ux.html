<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>PXView 信号滤波交互原型</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; }
  body {
    background: #1a1d24;
    color: #e0e0e0;
    overflow: hidden;
    user-select: none;
  }

  /* ===== 顶部工具栏 ===== */
  #toolbar {
    height: 48px;
    background: #252932;
    border-bottom: 1px solid #3a3f4b;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    font-size: 13px;
  }
  #toolbar .brand {
    font-weight: 600;
    color: #4dd0e1;
    font-size: 14px;
    margin-right: 8px;
  }
  #toolbar .subtitle { color: #9e9e9e; }
  #toolbar .spacer { flex: 1; }
  .btn {
    background: #2d323d;
    border: 1px solid #3a3f4b;
    color: #e0e0e0;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    transition: all .15s;
  }
  .btn:hover { background: #3a3f4b; border-color: #4a5060; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary {
    background: #1976d2;
    border-color: #1976d2;
    color: #fff;
  }
  .btn-primary:hover { background: #2196f3; }
  .btn-primary:disabled { background: #2d323d; border-color: #3a3f4b; color: #9e9e9e; }
  .preset-select {
    background: #2d323d;
    border: 1px solid #3a3f4b;
    color: #e0e0e0;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
  }

  /* ===== 主区域 ===== */
  #main {
    display: flex;
    height: calc(100% - 48px);
  }
  #labels {
    width: 100px;
    background: #1f232b;
    border-right: 1px solid #3a3f4b;
    flex-shrink: 0;
  }
  .label-row {
    height: 64px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 12px;
    border-bottom: 1px solid #2a2f38;
    cursor: context-menu;
    position: relative;
    transition: background .15s;
  }
  .label-row:hover { background: #2a2f38; }
  .label-row.active { background: #2d3a4a; border-left: 3px solid #4dd0e1; padding-left: 9px; }
  .label-row .ch { font-weight: 600; font-size: 13px; }
  .label-row .lbl { font-size: 11px; color: #9e9e9e; margin-top: 2px; }
  .label-row .filtered-mark {
    position: absolute;
    right: 6px; top: 6px;
    width: 6px; height: 6px;
    background: #ffb74d;
    border-radius: 50%;
    display: none;
  }
  .label-row.is-filtered .filtered-mark { display: block; }

  #canvas-wrap {
    flex: 1;
    overflow: hidden;
    position: relative;
    background: #1a1d24;
  }
  canvas { display: block; }

  /* ===== 上下文菜单 ===== */
  #ctx-menu {
    position: absolute;
    background: #2d323d;
    border: 1px solid #3a3f4b;
    border-radius: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    padding: 4px 0;
    min-width: 220px;
    z-index: 100;
    display: none;
  }
  #ctx-menu .item {
    padding: 8px 16px;
    cursor: pointer;
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #ctx-menu .item:hover { background: #3a3f4b; }
  #ctx-menu .item .shortcut { color: #9e9e9e; font-size: 11px; margin-left: 16px; }
  #ctx-menu .sep { height: 1px; background: #3a3f4b; margin: 4px 0; }
  #ctx-menu .item.disabled { opacity: .4; cursor: not-allowed; }

  /* ===== 滤波浮窗 ===== */
  #filter-popup {
    position: absolute;
    background: #252932;
    border: 1px solid #3a3f4b;
    border-radius: 8px;
    box-shadow: 0 16px 48px rgba(0,0,0,.6);
    width: 420px;
    z-index: 200;
    display: none;
    overflow: hidden;
  }
  #filter-popup .header {
    padding: 12px 16px;
    background: #2d323d;
    border-bottom: 1px solid #3a3f4b;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
    font-size: 13px;
  }
  #filter-popup .header .close {
    cursor: pointer;
    color: #9e9e9e;
    font-size: 18px;
    line-height: 1;
  }
  #filter-popup .header .close:hover { color: #e0e0e0; }
  #filter-popup .body { padding: 16px; }
  #filter-popup .section-title {
    font-size: 11px;
    color: #9e9e9e;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  /* 直方图 */
  .histogram {
    height: 140px;
    background: #1a1d24;
    border: 1px solid #2a2f38;
    border-radius: 4px;
    padding: 8px;
    position: relative;
    margin-bottom: 12px;
  }
  .histogram-bars {
    display: flex;
    align-items: flex-end;
    height: 100%;
    gap: 2px;
    position: relative;
  }
  .histogram-bar {
    flex: 1;
    background: #4a5060;
    border-radius: 2px 2px 0 0;
    min-height: 2px;
    transition: background .15s;
    position: relative;
  }
  .histogram-bar.will-filter { background: #ff5252; }
  .histogram-bar.recommend-bar { background: #ffb74d; }
  .histogram-labels {
    display: flex;
    gap: 2px;
    margin-top: 4px;
    font-size: 9px;
    color: #9e9e9e;
  }
  .histogram-label { flex: 1; text-align: center; }
  .threshold-line {
    position: absolute;
    top: 0;
    bottom: 18px;
    width: 2px;
    background: #ff9800;
    pointer-events: none;
    transition: left .08s;
  }
  .threshold-line::before {
    content: '推荐';
    position: absolute;
    top: -16px;
    left: 50%;
    transform: translateX(-50%);
    background: #ff9800;
    color: #000;
    font-size: 9px;
    padding: 1px 4px;
    border-radius: 2px;
    white-space: nowrap;
  }
  .threshold-line.user { background: #42a5f5; }
  .threshold-line.user::before { content: '当前'; background: #42a5f5; color: #fff; }

  /* 控件 */
  .control-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .control-row label { font-size: 12px; color: #9e9e9e; width: 50px; flex-shrink: 0; }
  select {
    background: #1a1d24;
    border: 1px solid #3a3f4b;
    color: #e0e0e0;
    padding: 6px 8px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
  }
  input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    background: #3a3f4b;
    border-radius: 2px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    background: #42a5f5;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid #fff;
  }
  .threshold-value {
    background: #1a1d24;
    border: 1px solid #3a3f4b;
    padding: 4px 10px;
    border-radius: 4px;
    font-family: 'Consolas', monospace;
    font-size: 13px;
    color: #42a5f5;
    min-width: 50px;
    text-align: center;
  }
  .stats {
    background: #1a1d24;
    border: 1px solid #2a2f38;
    border-radius: 4px;
    padding: 10px 12px;
    margin-bottom: 12px;
    font-size: 12px;
    display: flex;
    justify-content: space-between;
  }
  .stats .num { color: #ff5252; font-weight: 600; font-size: 14px; }
  .stats .num.saved { color: #81c784; }

  .footer-btns {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #3a3f4b;
  }
  .footer-btns .spacer { flex: 1; }

  /* ===== 状态栏 ===== */
  #statusbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 28px;
    background: #1f232b;
    border-top: 1px solid #3a3f4b;
    display: flex;
    align-items: center;
    padding: 0 16px;
    font-size: 11px;
    color: #9e9e9e;
    gap: 16px;
    z-index: 50;
  }
  #statusbar .hint { color: #ffb74d; }

  /* tooltip */
  #tooltip {
    position: absolute;
    background: #000;
    border: 1px solid #555;
    padding: 4px 8px;
    border-radius: 3px;
    font-size: 11px;
    pointer-events: none;
    z-index: 300;
    display: none;
    white-space: nowrap;
  }

  /* 提示气泡 */
  #toast {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    background: #2d323d;
    border: 1px solid #4a5060;
    color: #e0e0e0;
    padding: 10px 20px;
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
    font-size: 13px;
    z-index: 400;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }
  #toast.success { border-color: #81c784; color: #81c784; }
</style>
</head>
<body>

<div id="toolbar">
  <span class="brand">PXView</span>
  <span class="subtitle">信号滤波交互原型 · 右键通道标签试试</span>
  <div class="spacer"></div>
  <select class="preset-select" id="preset">
    <option value="">预设...</option>
    <option value="2,0">I2C 抗串扰 (2 cycles, Both)</option>
    <option value="3,1">SPI 启动毛刺 (3 cycles, High)</option>
    <option value="5,0">通用 5 周期滤波</option>
  </select>
  <button class="btn" id="btn-undo" disabled>↶ 撤销 (Ctrl+Z)</button>
  <button class="btn" id="btn-clear" disabled>清除全部滤波</button>
</div>

<div id="main">
  <div id="labels"></div>
  <div id="canvas-wrap">
    <canvas id="waveform"></canvas>
  </div>
</div>

<div id="ctx-menu">
  <div class="item" data-action="filter">🔍 滤除毛刺... <span class="shortcut">F</span></div>
  <div class="item" data-action="invert">↔ 信号取反 <span class="shortcut">I</span></div>
  <div class="sep"></div>
  <div class="item" data-action="clear">✕ 清除此通道滤波</div>
  <div class="item" data-action="clear-all">✕ 清除所有通道滤波</div>
</div>

<div id="filter-popup">
  <div class="header">
    <span id="popup-title">D0 (SCK) 毛刺滤波</span>
    <span class="close" id="popup-close">×</span>
  </div>
  <div class="body">
    <div class="section-title">脉冲宽度分布</div>
    <div class="histogram">
      <div class="histogram-bars" id="histogram-bars"></div>
      <div class="histogram-labels" id="histogram-labels"></div>
      <div class="threshold-line" id="threshold-recommend" style="left:0"></div>
      <div class="threshold-line user" id="threshold-user" style="left:0;display:none"></div>
    </div>

    <div class="stats" id="stats-row">
      <span>将滤除: <span class="num" id="filter-count">0</span> 个脉冲</span>
      <span>剩余有效脉冲: <span class="num saved" id="remain-count">0</span> 个</span>
    </div>

    <div class="control-row">
      <label>类型</label>
      <select id="mode-select">
        <option value="0">Both (双向毛刺)</option>
        <option value="1">High (仅高电平上的低毛刺)</option>
        <option value="2">Low (仅低电平上的高毛刺)</option>
      </select>
    </div>

    <div class="control-row">
      <label>阈值</label>
      <input type="range" id="threshold-slider" min="1" max="20" value="3">
      <span class="threshold-value" id="threshold-display">3</span>
      <span style="font-size:11px;color:#9e9e9e">cycles</span>
    </div>

    <div class="footer-btns">
      <button class="btn" id="btn-apply-one">应用到本通道</button>
      <button class="btn btn-primary" id="btn-apply-all">应用到所有逻辑通道 →</button>
      <div class="spacer"></div>
      <button class="btn" id="btn-cancel">取消</button>
    </div>
  </div>
</div>

<div id="statusbar">
  <span>状态: <span id="status-text">就绪</span></span>
  <span class="hint" id="status-hint">💡 提示: 右键通道标签 → 滤除毛刺,拖动滑块实时预览,Ctrl+Z 撤销</span>
</div>

<div id="tooltip"></div>
<div id="toast"></div>

<script>
// ============================================================
// 1. 波形数据生成
// ============================================================
const SAMPLE_COUNT = 1400;
const CHANNEL_HEIGHT = 64;

// 通道定义
const channelDefs = [
  { name: 'D0', label: 'SCK',  color: '#4dd0e1' },
  { name: 'D1', label: 'SDA',  color: '#81c784' },
  { name: 'D2', label: 'MOSI', color: '#ffd54f' },
  { name: 'D3', label: 'MISO', color: '#ffb74d' },
  { name: 'D4', label: 'CS',   color: '#ba68c8' },
  { name: 'D5', label: 'INT',  color: '#f06292' },
  { name: 'D6', label: 'CLK',  color: '#64b5f6' },
  { name: 'D7', label: 'EN',   color: '#aed581' },
];

// 状态: 每个通道的原始数据 + 当前滤波配置
const channels = channelDefs.map(def => ({
  ...def,
  data: generateChannelData(def.name),
  filter: null,  // { threshold, mode }
  inverted: false,
}));

// 历史栈,用于撤销
const historyStack = [];

function generateChannelData(name) {
  const data = new Array(SAMPLE_COUNT).fill(0);
  const seed = name.charCodeAt(1) * 13;

  if (name === 'D0') {
    // SCK: 标准时钟,60 采样周期
    for (let i = 0; i < SAMPLE_COUNT; i += 60) {
      for (let j = 0; j < 30 && i + j < SAMPLE_COUNT; j++) data[i + j] = 1;
    }
    // 插毛刺: 1-2 周期高脉冲
    [203, 451, 722, 953, 1180].forEach(p => { if (p < SAMPLE_COUNT) data[p] = 1; });
    [322, 612, 882].forEach(p => { if (p < SAMPLE_COUNT) data[p] = 0; });
    [203, 451].forEach(p => { if (p + 1 < SAMPLE_COUNT) data[p + 1] = 1; });
  } else if (name === 'D1') {
    // SDA: 不规则脉冲
    [[100, 50], [200, 80], [320, 25], [400, 90], [520, 40], [640, 70], [760, 35], [880, 85], [1000, 30], [1120, 60], [1240, 50]]
      .forEach(([s, w]) => { for (let i = 0; i < w && s + i < SAMPLE_COUNT; i++) data[s + i] = 1; });
    // 毛刺
    [155, 285, 465, 590, 815, 1035, 1280].forEach(p => { if (p < SAMPLE_COUNT) data[p] = 1; });
    [345, 720].forEach(p => { if (p < SAMPLE_COUNT) data[p] = 0; });
  } else if (name === 'D2' || name === 'D3') {
    // 类 SPI 数据
    [[80, 40], [180, 60], [280, 35], [380, 70], [480, 45], [580, 80], [680, 30], [780, 65], [880, 50], [980, 75], [1080, 40], [1180, 60], [1280, 45]]
      .forEach(([s, w]) => { for (let i = 0; i < w && s + i < SAMPLE_COUNT; i++) data[s + i] = 1; });
    [125, 225, 325, 425, 525, 625, 725, 825, 925, 1025, 1125, 1225, 1325].forEach(p => {
      if (p < SAMPLE_COUNT) data[p] = 1;
    });
  } else {
    // 普通逻辑: 随机长脉冲 + 毛刺
    let rng = seed;
    let pos = 50;
    while (pos < SAMPLE_COUNT - 50) {
      const w = 40 + (rng % 80);
      for (let i = 0; i < w && pos + i < SAMPLE_COUNT; i++) data[pos + i] = 1;
      pos += w + 30 + (rng % 50);
      rng = (rng * 1103515245 + 12345) & 0x7fffffff;
    }
    // 毛刺
    for (let k = 0; k < 5; k++) {
      const p = 100 + k * 250 + (rng % 80);
      if (p < SAMPLE_COUNT) data[p] = data[p] === 0 ? 1 : 0;
      rng = (rng * 1103515245 + 12345) & 0x7fffffff;
    }
  }
  return data;
}

// ============================================================
// 2. 脉冲分析与直方图
// ============================================================
function findPulses(data) {
  const pulses = [];
  let i = 0;
  while (i < data.length) {
    const level = data[i];
    const start = i;
    while (i < data.length && data[i] === level) i++;
    pulses.push({ start, end: i, width: i - start, level });
  }
  return pulses;
}

function buildHistogram(pulses) {
  // 只统计短脉冲 (宽度 <= 30),长脉冲不算毛刺候选
  const hist = {};
  for (const p of pulses) {
    if (p.width <= 30) {
      hist[p.width] = (hist[p.width] || 0) + 1;
    }
  }
  return hist;
}

function recommendThreshold(hist) {
  // 简化算法: 找宽度分布的"间隙"
  // 实际中应根据脉冲宽度分布聚类
  const widths = Object.keys(hist).map(Number).sort((a, b) => a - b);
  if (widths.length === 0) return 3;
  if (widths.length === 1) return widths[0] + 1;

  // 找最大间隙
  let maxGap = 0, gapAfter = widths[0];
  for (let i = 1; i < widths.length; i++) {
    const gap = widths[i] - widths[i - 1];
    if (gap > maxGap) { maxGap = gap; gapAfter = widths[i - 1]; }
  }
  // 推荐值 = 间隙右侧 (即 gapAfter + 1, 但要确保把毛刺簇全包含)
  // 如果没有明显间隙,取较小宽度的中位数 +1
  if (maxGap <= 1) {
    const sorted = widths.sort((a, b) => a - b);
    return sorted[Math.floor(sorted.length * 0.3)] + 1;
  }
  return gapAfter + 1;
}

// 判断脉冲是否会被滤除
function willFilter(pulse, threshold, mode) {
  if (pulse.width > threshold) return false;
  // mode: 0=Both, 1=High (滤低毛刺, 即高电平基准上的低脉冲 → level==0)
  //       2=Low (滤高毛刺, 即低电平基准上的高脉冲 → level==1)
  if (mode === 0) return true;
  if (mode === 1 && pulse.level === 0) return true;
  if (mode === 2 && pulse.level === 1) return true;
  return false;
}

// ============================================================
// 3. Canvas 渲染
// ============================================================
const canvas = document.getElementById('waveform');
const ctx = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;

function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  render();
}

function render() {
  const w = canvas.width / dpr;
  const h = canvas.height / dpr;
  ctx.clearRect(0, 0, w, h);

  // 背景网格
  ctx.strokeStyle = '#222631';
  ctx.lineWidth = 1;
  for (let x = 0; x < w; x += 50) {
    ctx.beginPath();
    ctx.moveTo(x + 0.5, 0);
    ctx.lineTo(x + 0.5, h);
    ctx.stroke();
  }

  // 渲染每个通道
  channels.forEach((ch, idx) => {
    drawChannel(ch, idx, w);
  });
}

function drawChannel(ch, idx, canvasWidth) {
  const y0 = idx * CHANNEL_HEIGHT;
  const midY = y0 + CHANNEL_HEIGHT / 2;
  const amp = 20;

  // 通道背景 (轻微高亮活动通道)
  if (ch.filter) {
    ctx.fillStyle = 'rgba(255, 183, 77, 0.04)';
    ctx.fillRect(0, y0, canvasWidth, CHANNEL_HEIGHT);
  }

  // 中线
  ctx.strokeStyle = '#2a2f38';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, midY + 0.5);
  ctx.lineTo(canvasWidth, midY + 0.5);
  ctx.stroke();

  // 计算可见数据范围
  const sampleStep = Math.max(1, Math.floor(SAMPLE_COUNT / canvasWidth));

  // 渲染滤波高亮 (在波形下方)
  if (ch.filter) {
    const pulses = findPulses(ch.data);
    ctx.fillStyle = 'rgba(255, 82, 82, 0.35)';
    for (const p of pulses) {
      if (willFilter(p, ch.filter.threshold, ch.filter.mode)) {
        const x1 = (p.start / SAMPLE_COUNT) * canvasWidth;
        const x2 = (p.end / SAMPLE_COUNT) * canvasWidth;
        ctx.fillRect(x1, y0 + 6, Math.max(1, x2 - x1), CHANNEL_HEIGHT - 12);
      }
    }
  }

  // 渲染波形 (取反时翻转)
  const data = ch.data;
  const invert = ch.inverted;
  ctx.strokeStyle = ch.color;
  ctx.lineWidth = 1.5;
  ctx.beginPath();

  let prevY = midY;
  for (let i = 0; i < SAMPLE_COUNT; i += sampleStep) {
    const bit = invert ? (1 - data[i]) : data[i];
    const y = midY - (bit ? amp : -amp);
    const x = (i / SAMPLE_COUNT) * canvasWidth;
    if (i === 0) {
      ctx.moveTo(x, y);
    } else {
      if (y !== prevY) {
        ctx.lineTo(x, prevY);
        ctx.lineTo(x, y);
      } else {
        ctx.lineTo(x, y);
      }
    }
    prevY = y;
  }
  ctx.stroke();
}

// ============================================================
// 4. UI 构建: 通道标签
// ============================================================
function buildLabels() {
  const container = document.getElementById('labels');
  container.innerHTML = '';
  channels.forEach((ch, idx) => {
    const row = document.createElement('div');
    row.className = 'label-row' + (ch.filter ? ' is-filtered' : '');
    row.dataset.idx = idx;
    row.innerHTML = `
      <div class="ch">${ch.name}</div>
      <div class="lbl">${ch.label}</div>
      <div class="filtered-mark" title="已应用滤波"></div>
    `;
    row.addEventListener('contextmenu', e => {
      e.preventDefault();
      showContextMenu(e, idx);
    });
    row.addEventListener('click', () => {
      // 单击打开滤波浮窗 (便捷入口)
      openFilterPopup(idx);
    });
    container.appendChild(row);
  });
}

// ============================================================
// 5. 上下文菜单
// ============================================================
let activeChannelIdx = -1;
const ctxMenu = document.getElementById('ctx-menu');

function showContextMenu(e, idx) {
  activeChannelIdx = idx;
  ctxMenu.style.display = 'block';
  ctxMenu.style.left = e.clientX + 'px';
  ctxMenu.style.top = e.clientY + 'px';

  // 禁用状态
  const ch = channels[idx];
  ctxMenu.querySelector('[data-action="clear"]').classList.toggle('disabled', !ch.filter);
}

function hideContextMenu() {
  ctxMenu.style.display = 'none';
}

ctxMenu.addEventListener('click', e => {
  const item = e.target.closest('.item');
  if (!item || item.classList.contains('disabled')) return;
  const action = item.dataset.action;
  hideContextMenu();
  if (action === 'filter') openFilterPopup(activeChannelIdx);
  else if (action === 'invert') toggleInvert(activeChannelIdx);
  else if (action === 'clear') clearChannelFilter(activeChannelIdx);
  else if (action === 'clear-all') clearAllFilters();
});

document.addEventListener('click', e => {
  if (!ctxMenu.contains(e.target)) hideContextMenu();
});

// ============================================================
// 6. 滤波浮窗
// ============================================================
const popup = document.getElementById('filter-popup');
let popupChannelIdx = -1;
let previewThreshold = 3;
let previewMode = 0;

function openFilterPopup(idx) {
  popupChannelIdx = idx;
  const ch = channels[idx];

  // 高亮当前通道
  document.querySelectorAll('.label-row').forEach(r => r.classList.remove('active'));
  document.querySelectorAll('.label-row')[idx].classList.add('active');

  // 标题
  document.getElementById('popup-title').textContent = `${ch.name} (${ch.label}) 毛刺滤波`;

  // 计算直方图
  const pulses = findPulses(ch.data);
  const hist = buildHistogram(pulses);
  const recommended = recommendThreshold(hist);

  // 渲染直方图
  renderHistogram(hist, recommended);

  // 默认值: 如果已有滤波配置则使用,否则用推荐值
  previewThreshold = ch.filter ? ch.filter.threshold : recommended;
  previewMode = ch.filter ? ch.filter.mode : 0;

  document.getElementById('threshold-slider').max = Math.max(20, recommended + 5);
  document.getElementById('threshold-slider').value = previewThreshold;
  document.getElementById('mode-select').value = previewMode;
  document.getElementById('threshold-display').textContent = previewThreshold;

  // 更新预览
  updatePreview();

  // 显示浮窗 (位置: 在通道标签右侧)
  const labelRow = document.querySelectorAll('.label-row')[idx];
  const rect = labelRow.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = (rect.right + 8) + 'px';
  popup.style.top = Math.min(rect.top, window.innerHeight - popup.offsetHeight - 40) + 'px';

  setStatus(`分析 ${ch.name} (${ch.label}) - 推荐阈值 ${recommended} 周期`);
}

function closeFilterPopup() {
  popup.style.display = 'none';
  document.querySelectorAll('.label-row').forEach(r => r.classList.remove('active'));
  // 清除预览
  if (popupChannelIdx >= 0 && !channels[popupChannelIdx].filter) {
    render();
  }
  popupChannelIdx = -1;
}

function renderHistogram(hist, recommended) {
  const barsContainer = document.getElementById('histogram-bars');
  const labelsContainer = document.getElementById('histogram-labels');
  barsContainer.innerHTML = '';
  labelsContainer.innerHTML = '';

  const maxBarWidth = 30;
  const widths = [];
  for (let w = 1; w <= maxBarWidth; w++) widths.push(w);

  const maxCount = Math.max(1, ...Object.values(hist));

  widths.forEach(w => {
    const count = hist[w] || 0;
    const bar = document.createElement('div');
    bar.className = 'histogram-bar';
    bar.dataset.width = w;
    bar.dataset.count = count;
    bar.style.height = (count > 0 ? (count / maxCount * 100) : 0) + '%';
    bar.title = `${w} 周期: ${count} 个脉冲`;
    barsContainer.appendChild(bar);

    const lbl = document.createElement('div');
    lbl.className = 'histogram-label';
    lbl.textContent = (w % 5 === 0 || w === 1) ? w : '';
    labelsContainer.appendChild(lbl);
  });

  // 推荐阈值线
  const recommendLine = document.getElementById('threshold-recommend');
  recommendLine.style.left = ((recommended - 1) / (maxBarWidth - 1) * 100) + '%';

  // 存储推荐值用于预览更新
  recommendLine.dataset.value = recommended;
}

function updatePreview() {
  const ch = channels[popupChannelIdx];
  if (!ch) return;

  // 更新直方图着色 (标记将被滤除的宽度)
  const bars = document.querySelectorAll('.histogram-bar');
  bars.forEach(bar => {
    const w = parseInt(bar.dataset.width);
    bar.classList.remove('will-filter');
    if (w <= previewThreshold) bar.classList.add('will-filter');
  });

  // 更新当前阈值线
  const userLine = document.getElementById('threshold-user');
  userLine.style.display = 'block';
  userLine.style.left = ((previewThreshold - 1) / 29 * 100) + '%';

  // 更新数值显示
  document.getElementById('threshold-display').textContent = previewThreshold;

  // 统计
  const pulses = findPulses(ch.data);
  let filterCount = 0, remainCount = 0;
  for (const p of pulses) {
    if (p.width <= 30) {
      if (willFilter(p, previewThreshold, previewMode)) filterCount++;
      else remainCount++;
    }
  }
  document.getElementById('filter-count').textContent = filterCount;
  document.getElementById('remain-count').textContent = remainCount;

  // 实时预览: 在波形上画出预览高亮 (不修改 ch.filter)
  renderPreviewOverlay();
}

function renderPreviewOverlay() {
  // 临时渲染: 把预览的阈值作为该通道的 filter 渲染一次
  const ch = channels[popupChannelIdx];
  if (!ch) return;

  const realFilter = ch.filter;
  ch.filter = { threshold: previewThreshold, mode: previewMode, preview: true };
  render();
  ch.filter = realFilter;
}

// 滑块事件
document.getElementById('threshold-slider').addEventListener('input', e => {
  previewThreshold = parseInt(e.target.value);
  updatePreview();
});

document.getElementById('mode-select').addEventListener('change', e => {
  previewMode = parseInt(e.target.value);
  updatePreview();
});

// 应用按钮
document.getElementById('btn-apply-one').addEventListener('click', () => {
  applyFilter(popupChannelIdx, previewThreshold, previewMode);
  closeFilterPopup();
  showToast(`已对 ${channels[popupChannelIdx >= 0 ? popupChannelIdx : 0].name} 应用滤波`, 'success');
});

document.getElementById('btn-apply-all').addEventListener('click', () => {
  // 保存历史
  pushHistory();
  channels.forEach((ch, idx) => {
    if (popupChannelIdx !== idx) pushSnapshot(idx);
    ch.filter = { threshold: previewThreshold, mode: previewMode };
  });
  refreshAll();
  closeFilterPopup();
  showToast(`已对所有逻辑通道应用滤波 (阈值 ${previewThreshold})`, 'success');
});

document.getElementById('btn-cancel').addEventListener('click', closeFilterPopup);
document.getElementById('popup-close').addEventListener('click', closeFilterPopup);

function applyFilter(idx, threshold, mode) {
  pushHistory();
  channels[idx].filter = { threshold, mode };
  refreshAll();
}

function pushHistory() {
  // 快照所有通道的 filter 状态
  const snapshot = channels.map(ch => ({
    filter: ch.filter ? { ...ch.filter } : null,
    inverted: ch.inverted,
  }));
  historyStack.push(snapshot);
  if (historyStack.length > 20) historyStack.shift();
  updateUndoButton();
}

function pushSnapshot(idx) {
  // 占位 (实际应用 pushHistory 已经全量快照)
}

function undo() {
  if (historyStack.length === 0) return;
  const snapshot = historyStack.pop();
  snapshot.forEach((s, idx) => {
    channels[idx].filter = s.filter ? { ...s.filter } : null;
    channels[idx].inverted = s.inverted;
  });
  refreshAll();
  updateUndoButton();
  showToast('已撤销', 'success');
}

function clearChannelFilter(idx) {
  pushHistory();
  channels[idx].filter = null;
  refreshAll();
  showToast(`${channels[idx].name} 滤波已清除`, 'success');
}

function clearAllFilters() {
  if (!channels.some(c => c.filter)) return;
  pushHistory();
  channels.forEach(ch => ch.filter = null);
  refreshAll();
  showToast('所有通道滤波已清除', 'success');
}

function toggleInvert(idx) {
  pushHistory();
  channels[idx].inverted = !channels[idx].inverted;
  refreshAll();
  showToast(`${channels[idx].name} 已${channels[idx].inverted ? '取反' : '恢复'}`, 'success');
}

function refreshAll() {
  buildLabels();
  render();
  updateUndoButton();
  updateClearButton();
}

function updateUndoButton() {
  document.getElementById('btn-undo').disabled = historyStack.length === 0;
}
function updateClearButton() {
  document.getElementById('btn-clear').disabled = !channels.some(c => c.filter);
}

document.getElementById('btn-undo').addEventListener('click', undo);
document.getElementById('btn-clear').addEventListener('click', clearAllFilters);

// 预设
document.getElementById('preset').addEventListener('change', e => {
  if (!e.target.value) return;
  const [t, m] = e.target.value.split(',').map(Number);
  pushHistory();
  channels.forEach(ch => ch.filter = { threshold: t, mode: m });
  refreshAll();
  showToast(`已应用预设: 阈值 ${t} 周期`, 'success');
  e.target.value = '';
});

// ============================================================
// 7. Toast 提示
// ============================================================
const toast = document.getElementById('toast');
let toastTimer = null;
function showToast(msg, type = '') {
  toast.textContent = msg;
  toast.className = type;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}

function setStatus(text) {
  document.getElementById('status-text').textContent = text;
}

// ============================================================
// 8. 全局键盘快捷键
// ============================================================
document.addEventListener('keydown', e => {
  // Ctrl+Z 撤销
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
    e.preventDefault();
    undo();
    return;
  }
  // Esc 关闭浮窗
  if (e.key === 'Escape') {
    if (popup.style.display === 'block') closeFilterPopup();
    hideContextMenu();
    return;
  }
  // F 打开滤波 (当鼠标在某通道标签上时)
  if (e.key === 'f' && activeChannelIdx >= 0 && !e.ctrlKey) {
    openFilterPopup(activeChannelIdx);
  }
  // I 取反
  if (e.key === 'i' && activeChannelIdx >= 0 && !e.ctrlKey) {
    toggleInvert(activeChannelIdx);
  }
});

// ============================================================
// 9. 波形上的鼠标交互 (hover 显示毛刺信息)
// ============================================================
const tooltip = document.getElementById('tooltip');
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const idx = Math.floor(y / CHANNEL_HEIGHT);

  if (idx < 0 || idx >= channels.length) {
    tooltip.style.display = 'none';
    return;
  }

  const ch = channels[idx];
  if (!ch.filter) {
    tooltip.style.display = 'none';
    return;
  }

  // 找到鼠标位置对应的脉冲
  const samplePos = Math.floor(x / rect.width * SAMPLE_COUNT);
  const pulses = findPulses(ch.data);
  const pulse = pulses.find(p => samplePos >= p.start && samplePos < p.end);

  if (pulse && willFilter(pulse, ch.filter.threshold, ch.filter.mode)) {
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 12) + 'px';
    tooltip.style.top = (e.clientY + 12) + 'px';
    tooltip.innerHTML = `${ch.name} · <span style="color:#ff5252">${pulse.width} 周期${pulse.level ? '高' : '低'}脉冲</span><br>已滤除 (阈值 ${ch.filter.threshold})`;
  } else {
    tooltip.style.display = 'none';
  }
});

canvas.addEventListener('mouseleave', () => {
  tooltip.style.display = 'none';
});

// ============================================================
// 10. 初始化
// ============================================================
window.addEventListener('resize', resizeCanvas);
buildLabels();
resizeCanvas();

// 欢迎提示
setTimeout(() => {
  showToast('💡 右键通道标签试试,或直接单击通道名', '');
}, 300);
</script>
